    <p>© 2569 โครงงานนวัตกรรมดิจิทัล: การพัฒนาเว็บแอปพลิเคชันเพื่อบริหารจัดการและสื่อสารข้อมูล ศูนย์พัฒนาเด็กเล็ก เทศบาลเมืองบางใหญ่ จังหวัดนนทบุรี</p>
    <p style="margin-top: 0.25rem; font-size: 0.8rem; color: var(--text-subtle);">ผู้จัดทำ: นาย ณัฐธีร์ วิสุทธิ์อัมพร & นาย พงศกร ฤกษ์รูจี | สาขาวิชาการจัดการนวัตกรรมดิจิทัลและคอนเทนท์ มหาวิทยาลัยราชภัฏสวนสุนันทา</p>

  <script src="./js/app.js"></script>

  <!-- Service Worker & PWA Add to Home Screen Controller -->
  <script>
    window.deferredPWAInstallPrompt = null;

    // Listen for Android / Chrome / Edge PWA install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      console.log('📲 PWA Install Prompt is ready and captured.');
      // Notify components to show install button
      window.dispatchEvent(new CustomEvent('pwa-installable'));
    });

    window.addEventListener('appinstalled', () => {
      window.deferredPWAInstallPrompt = null;
      console.log('🎉 PWA installed successfully to home screen!');
      if (window.ModalsComponent) {
        window.ModalsComponent.showToast('🎉 ติดตั้งแอปบนหน้าจอมือถือสำเร็จแล้ว!', 'success');
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registered with scope:', reg.scope))
          .catch(err => console.warn('PWA ServiceWorker registration failed:', err));
      });
    }

    // Global 1-Click Install Trigger
    window.triggerPWAInstall = async function() {
      if (window.deferredPWAInstallPrompt) {
        window.deferredPWAInstallPrompt.prompt();
        const choiceResult = await window.deferredPWAInstallPrompt.userChoice;
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the PWA install prompt');
          if (window.ModalsComponent) {
            window.ModalsComponent.showToast('กำลังติดตั้งไอคอนแอปบนหน้าจอโทรศัพท์ของคุณ...', 'success');
          }
        }
        window.deferredPWAInstallPrompt = null;
      } else {
        // Fallback for iOS Safari or browsers where prompt was already handled
        if (window.ModalsComponent && typeof window.ModalsComponent.openPWAInstallModal === 'function') {
          window.ModalsComponent.openPWAInstallModal();
        }
      }
    };
  </script>

</body>
